name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # without this the matrix is a lie: Go would fetch the toolchain named in go.mod
      # and every job would run that same version instead of the one it claims to test
      GOTOOLCHAIN: local
    steps:
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout out code
        uses: actions/checkout@v3
      - name: Vet & test
        run: |
          # Vet & test
          go install golang.org/x/lint/golint@latest
          go vet -v ./...
          go test -v ./...
          golint -set_exit_status ./...
