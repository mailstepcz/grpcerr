name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.27.x]
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # pin each job to the version it was set up with; without this Go fetches the
      # toolchain named in go.mod and every job silently runs that one instead.
      # Only 1.27.x is listed because serr's go directive requires go 1.27.1.
      GOTOOLCHAIN: local
    steps:
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout out code
        uses: actions/checkout@v3
      - name: Vet & test
        run: |
          # Vet & test
          go install golang.org/x/lint/golint@latest
          go vet -v ./...
          go test -v ./...
          golint -set_exit_status ./...
